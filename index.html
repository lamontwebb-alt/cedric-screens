Look: sketch B v2. This page holds no data. Everything comes from Supabase functions that first check Telegram's signed
launch data (only Lamont, only from Cedric's bot, under 24 hours old). Published to GitHub Pages by screens/publish.sh.
All text from mail and documents is inserted as text, never as HTML (the reader's markdown is escaped first by md()).
v2: instant Done/Later/Hold/Bring back (optimistic, Undo for Done), queued actions show their state and Cedric's answer
on the card, offline note, Tasks/Make swipe panes.

const state = {

// ---------- talking to the database ----------
async function rpc(fn, args) {
  let r;
  try {
    r = await fetch(CONFIG.url + "/rest/v1/rpc/" + fn, { method: "POST",
      headers: { "Content-Type": "application/json", apikey: CONFIG.key, ...(CONFIG.key.startsWith("eyJ") ? { Authorization: "Bearer " + CONFIG.key } : {}) },
      body: JSON.stringify({ p_init: INIT, ...args }) });
  } catch (e) { const x = new Error("network"); x.network = true; throw x; }
  if (!r.ok) { const t = await r.text(); throw new Error(r.status === 403 || /not allowed/.test(t) ? "not-allowed" : "HTTP " + r.status); }
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
function newId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = b[6] & 15 | 64; b[8] = b[8] & 63 | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, "0")).join("");

// Every action carries its own client_id; a network failure is retried once with the SAME id, so it can never land twice.
async function act(a) {
  const p_action = { client_id: newId(), ...a };
  try { return await rpc("cedric_screen_act", { p_action }); }
  catch (e) { if (!e.network) throw e; await new Promise(r => setTimeout(r, 1200)); return await rpc("cedric_screen_act", { p_action }); }
}

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", 3200); }
function haptic(kind) { try { tg && tg.HapticFeedback && (kind === "ok" ? tg.HapticFeedback.notificationOccurred("success") : tg.HapticFeedback.impactOccurred("light")); } catch (e) {} }
const nowMs = () => Date.now() - state.skew;   // the database's clock, so a phone clock that is off doesn't fake "offline"
function when(iso) {
  if (!iso) return ""; const d = new Date(iso), now = new Date(nowMs()), day = 864e5;
  const days = Math.round((new Date(d.toDateString()) - new Date(now.toDateString())) / day);
  const t = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  if (days === 0) return "today " + t; if (days === 1) return "tomorrow"; if (days === -1) return "yesterday";
  if (days > 1 && days < 7) return d.toLocaleDateString([], { weekday: "short" });
  return d.toLocaleDateString([], { month: "short", day: "numeric" });
}
function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }
// Day labels in New York time, same rule as the database's later.label: Tomorrow / Sunday (within 6 days) / Mon Oct 26.
function nyDay(ms) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: NY, year: "numeric", month: "numeric", day: "numeric" }).formatToParts(new Date(ms)).map(x => [x.type, x.value]));
  return Math.round(Date.UTC(+p.year, +p.month - 1, +p.day) / 864e5);
}
function dayLabel(iso) {

  return new Date(ms).toLocaleDateString("en-US", { timeZone: NY, weekday: "short", month: "short", day: "numeric" }).replace(",", "");

  const o = begin(id); o.patch = { ...o.patch, ...gh.before }; render("tasks");
  let r;
  try { r = gh.result || await gh.call; } catch (e) { settle(o); return; }   // Done never landed; tap() has already put the card back
  try {
    await act({ loop_id: id, code: "undo", label: "Undo", target: r.action_id }); settle(o); haptic("ok");
  } catch (e) { settle(o); o.patch = { ...o.patch, status: "closed" }; render("tasks"); toast("Couldn't undo. It stays done; tap refresh to check."); }
  loadTasks();
}
async function cancelAction(it, e) {
  const o = begin(it.id); o.hide.add(e.action_id); render("tasks"); haptic();
  try {
    const r = await rpc("cedric_screen_cancel", { p_action_id: e.action_id }); settle(o);
    if (!(r && r.ok)) { o.hide.delete(e.action_id); toast("Too late to cancel: Cedric already has it."); }
  } catch (x) { settle(o); o.hide.delete(e.action_id); toast("Didn't cancel. Check your connection and try again."); }
  render("tasks"); loadTasks();
}
function retry(it, e) { queueAction(it, { code: e.code, label: e.label, note: e.note }); }
async function togglePin(m) {
  m.pinned = !m.pinned; render("make");
  try { await rpc("cedric_screen_pin", { p_id: m.id, p_pinned: m.pinned }); } catch (e) { m.pinned = !m.pinned; render("make"); toast("Couldn't change the pin."); }
}

// ---------- rendering and loading ----------
function render(which) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === state.tab));
  for (const k of which ? [which] : PANES) {
    const main = $("#" + k + "Main"), pane = main.parentNode, top = pane.scrollTop;
    main.replaceChildren();
    if (state.error) main.append(el("div", { class: "msg" }, state.error));
    else if (k === "tasks") { if (state.tasks) renderTasks(main); else main.append(el("div", { class: "msg" }, "Loading…")); }
    else { if (state.make) renderMake(main); else main.append(el("div", { class: "msg" }, "Loading…")); }
    pane.scrollTop = top;
  }
}
function settleOver(t0) { for (const [id, o] of state.over) if (!o.inflight && o.resolvedAt && o.resolvedAt < t0) state.over.delete(id); }
function takeTasks(t, t0) {
  if (t && t.generated_at) state.skew = Date.now() - Date.parse(t.generated_at);
  state.tasks = t; settleOver(t0);
}
let loadingTasks = false;
async function loadTasks() {
  if (!INIT || loadingTasks) return; loadingTasks = true; const t0 = ++state.clock;
  try {
    const t = await rpc("cedric_screen_tasks_v2", {}); takeTasks(t, t0); state.error = null;
    const { generated_at, ...rest } = t || {}; const sig = JSON.stringify(rest) + "|" + state.over.size + "|" + state.undo.size + "|" + anyOffline(view());
    if (sig !== state.sig) { state.sig = sig; render(); }
  } catch (e) { if (!state.tasks) { state.error = errText(e); render(); } }
  finally { loadingTasks = false; }
}
function errText(e) { return e.message === "not-allowed" ? "This only opens for Cedric's owner, from Cedric's chat. Close it and open it again from the chat." : "Couldn't reach Cedric's database. Tap refresh to try again."; }
async function load(manual) {
  if (!INIT) { state.error = "Open this from Cedric's chat in Telegram."; render(); return; }
  const t0 = ++state.clock;
  try {
    const [t, m] = await Promise.all([rpc("cedric_screen_tasks_v2", {}), rpc("cedric_screen_make", {})]);
    takeTasks(t, t0); state.make = m; state.error = null; state.sig = ""; render(); if (manual) toast("Up to date.");
  } catch (e) { state.error = errText(e); render(); }
}
// Poll every 10 s while something is waiting on Cedric and the page is visible (also re-checks the 90 s offline rule).
setInterval(() => { if (!document.hidden && anyPending()) loadTasks(); }, POLL_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });

// ---------- swiping between Tasks and Make ----------
// Native horizontal scroll-snap does the swipe; tabs follow the pane. A swipe never taps anything.
// Touches that start within 24 px of either edge never move the panes sideways (Android uses the edges for Back).
const panes = $("#panes");
function showPane(k, smooth) {
  const i = PANES.indexOf(k); if (i < 0) return;
  panes.scrollTo({ left: i * panes.clientWidth, behavior: smooth ? "smooth" : "auto" });
  setTab(k);
}
function setTab(k) {
  if (state.tab === k) return; state.tab = k; localStorage.setItem("cedric.tab", k);
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === k));
}
panes.addEventListener("scroll", () => { const i = Math.round(panes.scrollLeft / Math.max(1, panes.clientWidth)); setTab(PANES[Math.min(PANES.length - 1, Math.max(0, i))]); }, { passive: true });
window.addEventListener("resize", () => { panes.scrollLeft = PANES.indexOf(state.tab) * panes.clientWidth; });
let edgeTouch = null;
panes.addEventListener("touchstart", e => {
  const t = e.touches[0], w = window.innerWidth;
  edgeTouch = e.touches.length === 1 && (t.clientX < EDGE_PX || t.clientX > w - EDGE_PX) ? { x: t.clientX, y: t.clientY, axis: null } : null;
}, { passive: true });
panes.addEventListener("touchmove", e => {
  if (!edgeTouch) return; const t = e.touches[0], dx = Math.abs(t.clientX - edgeTouch.x), dy = Math.abs(t.clientY - edgeTouch.y);
  if (!edgeTouch.axis && (dx > 4 || dy > 4)) edgeTouch.axis = dx > dy ? "x" : "y";
  if (edgeTouch.axis === "x" && e.cancelable) e.preventDefault();   // sideways from the edge: ignored. Up/down from the edge: scrolls as usual.
}, { passive: false });
panes.addEventListener("touchend", () => { edgeTouch = null; }, { passive: true });
panes.addEventListener("touchcancel", () => { edgeTouch = null; }, { passive: true });

document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  const k = t.dataset.tab; haptic();
  if (k === "chat") { tg ? tg.close() : null; return; }
  closeReader(); showPane(k, true);
}));
if (tg) {
  tg.ready(); tg.expand();
  try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
  const applyTheme = () => document.documentElement.classList.toggle("dark", tg.colorScheme === "dark");
  applyTheme(); tg.onEvent("themeChanged", applyTheme);
  try { tg.setHeaderColor("bg_color"); } catch (e) {}
  tg.BackButton && tg.BackButton.onClick(() => { state.sheet ? closeNote(false) : closeReader(); });
}
render(); showPane(state.tab, false); load();
</script>
</body>
