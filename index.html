<!DOCTYPE html>
<!--
Cedric's screens: Tasks and Make, a Telegram Mini App. Spec: Cedric/SPEC-miniapp-v0.md (Part 2 = v2). Contracts: screens/CONTRACT-v2.md, screens/CONTRACT-v3.md.
Look: sketch B v2. This page holds no data. Everything comes from Supabase functions that first check Telegram's signed
launch data (only Lamont, only from Cedric's bot, under 24 hours old). Published to GitHub Pages by screens/publish.sh.
All text from mail and documents is inserted as text, never as HTML (the reader's markdown is escaped first by md()).
v2: instant Done/Later/Hold/Bring back (optimistic, Undo for Done), queued actions show their state and Cedric's answer,
offline note, Tasks/Make swipe panes.
v3 ("Up next", research/2026-10-24-screens-flow-pass/SYNTHESIS.md): Tasks shows only real questions to him, one at a time.
One ask in full (big question, why, big answer button), up to 3 one-line previews under it, Skip for now, Tell Cedric…,
Details. An answered card shows what happened for ~1 s over the next ask, which is already in place, then folds away.
Asks that arrive while he is on a card wait ("1 more ready after this") until he answers or skips it. A finish line when
nothing is left. Everything else (with Cedric, Cedric's, waiting on, back later, no question yet, recent updates) sits
behind one "Everything" list. No banner, no Seen, no New reply stripes, no Detail switch on Tasks.
v4 (screens/CONTRACT-v4.md, research/2026-10-24-pa-architecture-pass/SYNTHESIS.md): every ask carries Cedric's pick, why,
a quoted source line with "Wrong info", the pick as the main button, the real alternative as the second, and what happens
if he leaves it. Done on something Cedric can check (a bill, a booking) goes to "Checking" until it shows up. A yes on a
prepared item opens it at once (dialer with the number copied and the script sent to his chat, payment page with the
amount copied), with the number or amount shown big as a fallback. One honest "watching" line says what Cedric is
keeping an eye on and how fresh the data is. Heavier asks can wait for his day off ("Show anyway").
-->
<html lang="en">
<head>

<title>Cedric</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{

    --with:#A3ABB3; --reply:#2A66AC; --reply-tint:#E3EDF9; --on-reply:#FFFFFF; --done:#2C7A4B; --done-tint:#DDF0E3; --calm:#4A6077; --calm-tint:#E8EEF4;
    --pick:#7D6232;
  }
  :root.dark{
    --pick:#CDAE76;
    --page:#0F151C; --card:#18212B; --line:#26313D; --ink:#E9ECEF; --soft:#9AA6B2; --faint:#6F7B87;
    --navy:#B9CBE0; --navy-tint:#22303F; --on-navy:#0F151C; --brass:#8E7546; --inset:#121A23; --dim:rgba(0,0,0,.55); --bar:#141C25; --warn:#C9A86E;
    --with:#5A6774; --reply:#7EB2EA; --reply-tint:#1B2D41; --on-reply:#0F151C; --done:#74C594; --done-tint:#15301F; --calm:#A5B8CC; --calm-tint:#1F2B38;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  /* Two side-by-side panes; the row snaps horizontally, each pane scrolls on its own (so each keeps its place). */
  .panes{position:fixed;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
  .panes::-webkit-scrollbar{display:none}
  .pane{flex:0 0 100%;width:100%;height:100%;overflow-y:auto;overflow-x:hidden;scroll-snap-align:start;scroll-snap-stop:always;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
  main{padding:10px 18px 110px;min-height:100%}
  .top{display:flex;align-items:center;justify-content:space-between;padding:4px 0 8px;gap:10px}
  .who{display:flex;align-items:center;gap:10px;min-width:0}
  .mono{width:34px;height:34px;border-radius:9px;background:var(--navy);color:var(--on-navy);display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 18px/1 Georgia,"Times New Roman",serif;flex:none}
  .mono i{display:block;width:14px;height:2px;background:var(--brass);margin-top:3px;border-radius:1px}
  .who b{font-size:17px;font-weight:600}
  .who span{display:block;font-size:13px;color:var(--soft);margin-top:1px}
  .who .off{display:inline-flex;align-items:center;gap:5px;margin-left:8px;font-style:normal;font-weight:600;color:var(--warn)}
  .who .off::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--warn)}
  .right{display:flex;align-items:center;gap:8px;flex:none}
  .sw{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--soft)}
  .track{width:42px;height:25px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .15s}
  .track::after{content:"";position:absolute;top:2.5px;left:2.5px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
  .sw.on{color:var(--navy)} .sw.on .track{background:var(--navy)} .sw.on .track::after{left:19.5px}
  .refresh{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--soft)}
  .pill{display:inline-flex;align-items:center;gap:4px;font-size:15px;font-weight:600;color:var(--navy);background:var(--navy-tint);border-radius:999px;padding:0 14px;min-height:38px;white-space:nowrap}
  .pill svg{flex:none}
  h1{font-size:24px;line-height:1.25;font-weight:600;letter-spacing:-.01em;margin:4px 0 16px}
  h1 .q{color:var(--soft);font-weight:500}
  h1.count{font-size:19px;color:var(--soft);font-weight:600;margin:6px 2px 12px;letter-spacing:0}
  .glabel{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:22px 0 10px}
  .glabel .n{font-weight:600;color:var(--faint);letter-spacing:0}
  .mark{width:11px;height:11px;border-radius:50%;flex:none}
  .m-need{background:var(--navy)} .m-work{border:2px solid var(--navy);background:linear-gradient(90deg,var(--navy) 50%,transparent 50%)} .m-wait{border:2px solid var(--faint)} .m-with{background:var(--with)} .m-upd{background:var(--done)}

  /* ---- Up next: the one question in full ---- */
  .slot{position:relative}
  .acard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px 6px}
  .kick{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:14.5px;font-weight:600;color:var(--soft);min-height:22px}
  .kick .due.past{color:var(--warn)}
  .tag{font-size:12.5px;font-weight:600;color:var(--navy);background:var(--navy-tint);border-radius:6px;padding:2px 7px;white-space:nowrap}
  .ask{font-size:26px;line-height:1.24;font-weight:650;letter-spacing:-.015em;margin-top:10px;overflow-wrap:anywhere;text-wrap:pretty}
  .ask.long{font-size:22.5px;line-height:1.27}
  .why{font-size:17.5px;line-height:1.45;color:var(--soft);margin-top:9px;overflow-wrap:anywhere;white-space:pre-line}
  .dlink{display:inline-flex;align-items:center;gap:4px;font-size:15.5px;font-weight:600;color:var(--navy);padding:9px 0 2px;min-height:40px}
  .dlink .chev{margin-top:0}
  .kick .dlink{position:relative;margin-left:auto;padding:0;min-height:0;font-size:15px}
  .kick .dlink::after{content:"";position:absolute;inset:-12px -10px}
  .dlink[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .choices{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .primary{width:100%;min-height:58px;border-radius:16px;background:var(--navy);color:var(--on-navy);font-size:19px;font-weight:650;line-height:1.25;padding:12px 18px;text-align:center}
  .seconds{display:flex;gap:10px;flex-wrap:wrap}
  .second{flex:1 1 40%;min-height:52px;border-radius:15px;border:1.5px solid var(--line);background:var(--inset);font-size:17px;font-weight:600;line-height:1.25;color:var(--ink);padding:10px 14px;text-align:center}
  .dark .second{background:var(--navy-tint);border-color:var(--navy-tint)}
  .under{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
  .tell{display:inline-flex;align-items:center;gap:7px;font-size:16.5px;font-weight:600;color:var(--navy);padding:12px 2px;min-height:50px}
  .skip{font-size:15.5px;font-weight:600;color:var(--soft);padding:12px 2px;min-height:50px}
  .gone-line{font-size:17px;line-height:1.4;color:var(--ink);font-weight:600;margin-top:12px}
  /* v4: Cedric's pick, the source line, the way out, the watching line. */
  .reco{display:flex;gap:10px;font-size:17.5px;line-height:1.36;font-weight:600;color:var(--ink);margin-top:12px;overflow-wrap:anywhere}
  .reco::before{content:"";flex:none;width:3px;border-radius:2px;background:var(--brass)}
  .reco .k{color:var(--pick);font-weight:700}
  .why.s{font-size:16.5px;line-height:1.42;margin-top:8px}
  .src{font-size:14px;line-height:1.42;color:var(--soft);margin-top:9px;overflow-wrap:anywhere}
  .src q{quotes:"\201C" "\201D"}
  .wrong{position:relative;font-size:13.5px;font-weight:600;color:var(--navy);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;margin-left:8px;white-space:nowrap}
  .wrong::after{content:"";position:absolute;inset:-12px -8px}
  .wayout{font-size:14.5px;line-height:1.4;color:var(--soft);margin:12px 2px 0}
  .second.wide{flex-basis:100%}
  .second .sub{display:block;font-size:14px;font-weight:500;color:var(--soft);margin-top:2px}
  .tag.oh{color:var(--pick);background:transparent;border:1px solid var(--line)}
  .kick .rest{color:var(--pick)}
  .watch{display:flex;align-items:flex-start;gap:7px;font-size:14.5px;line-height:1.42;color:var(--soft);margin:-6px 2px 12px}
  .watch svg{flex:none;margin-top:2px;color:var(--calm)}
  .watch.stale svg{color:var(--warn)}
  .finish .watch{margin:14px 0 0}
  .restline{font-size:16px;line-height:1.42;color:var(--ink);margin-top:12px}
  .restline button{font-weight:600;color:var(--navy);padding:6px 0 6px 6px}
  /* v4: a yes that opened something (dialer, payment page): the number or amount big, Copy, open again. */
  .hand{background:var(--inset);border-radius:16px;padding:13px 16px 14px;margin-top:14px}
  .dark .hand{background:var(--navy-tint)}
  .h-k{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
  .h-big{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:3px;overflow-wrap:anywhere}
  .h-row{display:flex;gap:10px;margin-top:12px}
  .h-row .second{flex:1 1 0;min-height:48px;background:var(--card);padding:10px 12px;font-size:16px}
  .h-row .second.cp{flex:0 0 28%}
  .dark .h-row .second{background:var(--card);border-color:var(--line)}
  .h-note{font-size:14.5px;line-height:1.4;color:var(--soft);margin-top:10px;overflow-wrap:anywhere}
  .h-note b{color:var(--ink);font-weight:600}
  .script{margin-top:12px;border-left:3px solid var(--brass);padding-left:12px;display:flex;flex-direction:column;gap:4px}
  .script div{font-size:15.5px;line-height:1.38;overflow-wrap:anywhere}
  .chk{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:17px;line-height:1.4;font-weight:600;color:var(--calm)}
  .chk svg{flex:none;margin-top:2px}
  .chk.err{color:var(--warn)}
  .chk button{color:var(--navy);font-weight:600;margin-left:6px}
  .acard.gone .ask{color:var(--faint)}
  /* Details: the original, Cedric's notes, earlier rounds. */
  .details{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .d-title{font-size:15.5px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
  .d-notes{font-size:15.5px;line-height:1.42;color:var(--soft);overflow-wrap:anywhere;white-space:pre-line}
  .d-notes b{color:var(--ink);font-weight:600}
  .more{background:var(--inset);border-radius:12px;padding:11px 13px;font-size:15px;line-height:1.42;white-space:pre-wrap;word-wrap:break-word}
  .more .h{color:var(--soft);font-size:14px;white-space:normal} .more .h b{color:var(--ink);font-weight:600}
  .more .body{margin-top:7px;padding-top:7px;border-top:1px solid var(--line)}
  .more .kv{display:flex;justify-content:space-between;gap:12px;padding:2px 0;white-space:normal} .more .kv span{color:var(--soft)}
  .link{display:inline-block;margin-top:8px;font-size:14.5px;font-weight:600;color:var(--navy)}
  /* The small thread: his note, then where it stands or Cedric's answer. */
  .thread{border-left:2px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:5px}
  .th-me{font-size:15.5px;line-height:1.4;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
  .th-me.code{color:var(--soft)} .th-me.code b{color:var(--ink);font-weight:600}
  .th-ced{font-size:15.5px;line-height:1.4;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere} .th-ced b{color:var(--navy);font-weight:700}
  .th-st{font-size:14.5px;line-height:1.35;color:var(--soft);display:flex;flex-wrap:wrap;align-items:center;gap:0 14px}
  .th-st .s{padding:3px 0} .th-st.offline .s{flex-basis:100%;color:var(--warn);font-weight:600}
  .th-st.fail .s{color:var(--ink)}
  .th-btn{font-size:14.5px;font-weight:600;color:var(--navy);padding:8px 0}
  .th-gap{height:4px}
  /* An answered card: tinted with what happened for about a second, over the next ask (already in place), then it folds away. */
  .acard.exit{position:absolute;inset:0;z-index:2;overflow:hidden;pointer-events:none;padding-top:16px}
  .acard.exit .ask{opacity:.16}
  .x-done{background:var(--done-tint);border-color:var(--done);box-shadow:inset 0 0 0 1px var(--done)}
  .x-calm{background:var(--calm-tint);border-color:var(--calm);box-shadow:inset 0 0 0 1px var(--calm)}
  .x-badge{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:21px;font-weight:700;letter-spacing:-.005em;padding:0 16px;text-align:center}
  .x-line{display:flex;align-items:center;gap:9px}
  .x-sub{font-size:16.5px;font-weight:600;opacity:.9}
  .x-badge svg{width:26px;height:26px;flex:none}
  .x-done .x-badge{color:var(--done)} .x-calm .x-badge{color:var(--calm)}
  /* The next few, one line each. */
  .nexth{font-size:13.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:20px 2px 8px}
  .list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
  .pv{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:12px 12px 12px 16px;border-top:1px solid var(--line);text-align:left;font-size:16.5px;line-height:1.3}
  .pv:first-child{border-top:0}
  .pv .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rchev{flex:none;color:var(--faint)}
  .after{font-size:15px;color:var(--soft);margin:12px 4px 0}
  /* The finish line. */
  .finish{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 20px 18px}
  .fin-mark{width:46px;height:46px;border-radius:50%;background:var(--done-tint);color:var(--done);display:flex;align-items:center;justify-content:center}
  .fin-mark svg{width:26px;height:26px}
  .fin-t{font-size:26px;line-height:1.24;font-weight:650;letter-spacing:-.015em;margin-top:14px}
  .fin-s{font-size:17.5px;line-height:1.45;color:var(--soft);margin-top:8px}
  .fin-all{margin-top:16px}
  /* Everything: one line per item. */
  .erow{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:12px 12px 12px 16px;border-top:1px solid var(--line);text-align:left}
  .erow:first-child{border-top:0}
  .e-t{flex:1;min-width:50%;font-size:16.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .e-m{flex:0 1 auto;max-width:46%;font-size:14.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:420px){ .e-m{max-width:40%;font-size:14px} }
  .e-m.on{color:var(--navy);font-weight:600} .e-m.warn{color:var(--warn);font-weight:600} .e-m.back{color:var(--ink);font-weight:600}
  .c-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .c-wrap .e-t{min-width:0}
  .c-s{font-size:14.5px;line-height:1.3;color:var(--calm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .m-chk{border:2px solid var(--calm);background:var(--calm-tint)}
  .urow{display:block;width:100%;padding:12px 16px;border-top:1px solid var(--line);text-align:left}
  .urow:first-child{border-top:0}
  .u-top{display:flex;align-items:baseline;gap:10px}
  .u-t{flex:1;min-width:0;font-size:16px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .u-at{flex:none;font-size:13.5px;color:var(--faint)}
  .u-a{font-size:15px;line-height:1.4;color:var(--soft);margin-top:3px;overflow-wrap:anywhere}
  .urow:not(.open) .u-a{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .empty{font-size:17px;color:var(--soft);padding:24px 2px}
  /* A full card opened from Everything. */
  .cardview{position:fixed;inset:0;z-index:5;background:var(--page);overflow:auto;display:none;padding:12px 18px 40px}
  .back{font-size:16px;font-weight:600;color:var(--navy);padding:8px 0;min-height:44px}
  .fcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px 8px;margin-top:6px}
  .f-title{font-size:22px;line-height:1.28;font-weight:650;letter-spacing:-.01em;margin-top:10px;overflow-wrap:anywhere}
  .f-sub{font-size:15.5px;color:var(--soft);margin-top:6px;line-height:1.4;overflow-wrap:anywhere}
  .f-state{font-size:17px;line-height:1.4;margin-top:10px}
  .f-state b{font-weight:650}
  .fcard .details{margin-top:12px}
  .fcard > .seconds{margin-top:14px}
  .gonecard .f-sub{margin-bottom:10px}

  .mk{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:8px}
  .mk-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .mk-title{font-size:18px;font-weight:600;line-height:1.3}
  .mk-sub{font-size:14.5px;color:var(--soft);margin-top:2px}
  .first{font-size:15px;color:var(--soft);margin-top:4px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .pin{flex:none;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin:-6px -8px 0 0;color:var(--faint)}
  .pin.on{background:var(--navy-tint);color:var(--navy)}
  .nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:10px}
  .nums div{background:var(--inset);border-radius:10px;padding:7px 10px}
  .nums span{display:block;font-size:13.5px;color:var(--soft)}
  .nums b{display:block;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}
  .nums small{display:block;font-size:12.5px;color:var(--faint)}
  .tabs{position:fixed;left:0;right:0;bottom:0;height:calc(70px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--bar);border-top:1px solid var(--line);display:flex;padding-left:18px;padding-right:18px;z-index:3}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13.5px;font-weight:600;color:var(--faint);position:relative}

// Small, safe markdown: text is escaped first; only headings, lists, bold, italics, tables and paragraphs.

    if (/^\s*([-*]|\d+\.)\s+/.test(l)) { const ord = /^\s*\d+\./.test(l); const it = []; while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) { it.push("<li>" + inline(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, "")) + "</li>"); i++; }

    out.push("<p>" + para.join("<br>") + "</p>");

}
