<style>

<script>
"use strict";
const CONFIG = { url: "https://aeneuhxfhlygzanmztgg.supabase.co", key: "sb_publishable_oIjULBUKHtL16NFY1iD9Xg_Q-c7X9iP" };
const tg = window.Telegram && window.Telegram.WebApp;
const INIT = tg ? tg.initData : "";
const state = { tab: localStorage.getItem("cedric.tab") || "tasks", tasks: null, make: null, open: new Set(),
  detail: { tasks: localStorage.getItem("cedric.detail.tasks") === "1", make: localStorage.getItem("cedric.detail.make") === "1" },
  noteFor: null };
const SOURCE = { gmail: "Gmail", calendar: "Calendar", ticktick: "TickTick", tiller: "Bank", bank: "Bank", chat: "Chat", campaign: "Plan", health: "Health", cedric: "Cedric" };
const $ = (s, r) => (r || document).querySelector(s);

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
function svg(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
const ICON = {
  chev: '<svg class="chev" width="20" height="20" viewBox="0 0 20 20"><path d="M5 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  pen: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M10.5 2.5l3 3L6 13H3v-3z"/><path d="M9 4l3 3"/></svg>',
  pin: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M7 2.5h6l-1 5 3 3v1.5H5V10.5l3-3z"/><path d="M10 12v6" stroke-linecap="round"/></svg>',
  pinOn: '<svg width="20" height="20" viewBox="0 0 20 20"><path d="M7 2.5h6l-1 5 3 3v1.5H5V10.5l3-3z" fill="currentColor"/><path d="M10 12v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  refresh: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10a6 6 0 1 1-1.8-4.3"/><path d="M16 3.5v3.5h-3.5"/></svg>'
};

async function rpc(fn, args) {
  const r = await fetch(CONFIG.url + "/rest/v1/rpc/" + fn, { method: "POST",
    headers: { "Content-Type": "application/json", apikey: CONFIG.key, ...(CONFIG.key.startsWith("eyJ") ? { Authorization: "Bearer " + CONFIG.key } : {}) },
    body: JSON.stringify({ p_init: INIT, ...args }) });
  if (!r.ok) { const t = await r.text(); throw new Error(r.status === 403 || /not allowed/.test(t) ? "not-allowed" : "HTTP " + r.status); }
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", 3200); }
function haptic(kind) { try { tg && tg.HapticFeedback && (kind === "ok" ? tg.HapticFeedback.notificationOccurred("success") : tg.HapticFeedback.impactOccurred("light")); } catch (e) {} }
function when(iso) {
  if (!iso) return ""; const d = new Date(iso), now = new Date(), day = 864e5;
  const days = Math.round((new Date(d.toDateString()) - new Date(now.toDateString())) / day);
  const t = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  if (days === 0) return "today " + t; if (days === 1) return "tomorrow"; if (days === -1) return "yesterday";
  if (days > 1 && days < 7) return d.toLocaleDateString([], { weekday: "short" });
  return d.toLocaleDateString([], { month: "short", day: "numeric" });
}
function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

function header(sub, which) {
  const sw = el("button", { class: "sw" + (state.detail[which] ? " on" : ""), onclick: () => {
    state.detail[which] = !state.detail[which]; localStorage.setItem("cedric.detail." + which, state.detail[which] ? "1" : "0"); haptic(); render(); } },
    "Detail", el("span", { class: "track" }));
  const rf = el("button", { class: "refresh", "aria-label": "Refresh", onclick: () => load(true) }, svg(ICON.refresh));
  return el("div", { class: "top" },
    el("div", { class: "who" }, el("div", { class: "mono" }, "C", el("i")), el("div", {}, el("b", {}, "Cedric"), el("span", {}, sub))),
    el("div", { class: "right" }, sw, rf));
}

function moreBox(p, link) {
  if (!p && !link) return null;
  const box = el("div", { class: "more" });
  if (p && p.draft) {
    if (p.draft.to) box.append(el("div", { class: "h" }, "To: ", el("b", {}, p.draft.to)));
    if (p.draft.subject) box.append(el("div", { class: "h" }, "Subject: ", el("b", {}, p.draft.subject)));
    if (p.draft.body) box.append(el("div", { class: "body" }, p.draft.body));
  }
  if (p && Array.isArray(p.lines)) for (const l of p.lines) box.append(el("div", { class: "kv" }, el("span", {}, l.label), el("b", {}, l.value)));
  if (p && p.text) box.append(el("div", {}, p.text));
  if (link && /^https:\/\//.test(link)) box.append(el("button", { class: "link", onclick: () => tg ? tg.openLink(link) : window.open(link) }, "Open the original"));
  return box.childNodes.length ? box : null;
}

function taskCard(it) {
  const open = state.detail.tasks || state.open.has(it.id);
  const choices = Array.isArray(it.choices) && it.choices.length ? it.choices : [{ code: "later", label: "Later" }, { code: "done", label: "Done", primary: true }];
  const primary = choices.find(c => c.primary) || choices[choices.length - 1];
  const others = choices.filter(c => c !== primary);
  const needsReview = it.preview && it.preview.draft && !open;
  const card = el("div", { class: "card" + (open ? " open" : "") });
  const head = el("div", { class: "thead", onclick: () => { state.open.has(it.id) ? state.open.delete(it.id) : state.open.add(it.id); render(); } },
    el("div", { class: "t-title" }, it.title), svg(ICON.chev));
  card.append(head, el("div", { class: "t-detail" }, el("span", { class: "tag" }, SOURCE[it.source_kind] || it.source_kind), el("span", { class: "txt" }, it.detail || (it.due ? "Due " + when(it.due) : ""))));
  if (open) { const m = moreBox(it.preview, it.source_link); if (m) card.append(m); }
  if (it.queued) { card.append(el("div", { class: "queued" }, "Sent to Cedric. He'll confirm in the chat.")); return card; }
  const acts = el("div", { class: "actions" },
    el("div", {}, ...others.map(c => el("button", { class: "quiet", onclick: () => tap(it, c) }, c.label))),
    el("button", { class: "go", onclick: () => needsReview ? (state.open.add(it.id), render()) : tap(it, primary) }, needsReview ? "Review" : primary.label));
  card.append(acts, el("button", { class: "note", onclick: () => openNote(it) }, svg(ICON.pen), "Add a note"));
  return card;
}
function rowItem(it, kind) {
  const open = state.detail.tasks || state.open.has(it.id);
  const sub = kind === "wait" ? (it.held_since ? "Held since " + when(it.held_since) + ". " : "") + (it.detail || "") : (it.detail || "");
  const row = el("div", { class: "row" + (open ? " open" : "") },
    el("div", { class: "thead", onclick: () => { state.open.has(it.id) ? state.open.delete(it.id) : state.open.add(it.id); render(); } }, el("div", { class: "t-title" }, it.title), svg(ICON.chev)),
    el("div", { class: "t-detail" }, el("span", { class: "tag" }, SOURCE[it.source_kind] || it.source_kind), el("span", { class: "txt" }, sub)));
  if (open) { const m = moreBox(it.preview, it.source_link); if (m) row.append(m); }
  if (it.queued) row.append(el("div", { class: "queued" }, "Sent to Cedric."));
  else if (kind === "wait" && open) row.append(el("div", { class: "actions" }, el("button", { class: "quiet", onclick: () => tap(it, { code: "unhold", label: "Bring it back now" }) }, "Bring it back now"), el("button", { class: "note", onclick: () => openNote(it) }, svg(ICON.pen), "Add a note")));
  else if (open) row.append(el("button", { class: "note", onclick: () => openNote(it) }, svg(ICON.pen), "Add a note"));
  return row;
}

function renderTasks(main) {
  const d = state.tasks; const n = d.needs.length, w = d.working.length, h = d.wait.length;
  const now = new Date(); const part = now.getHours() < 12 ? "morning" : now.getHours() < 17 ? "afternoon" : "evening";
  main.append(header(now.toLocaleDateString([], { weekday: "long" }) + " " + part, "tasks"));
  const rest = [w ? plural(w, "thing", "things").replace(/thing(s?)$/, "I'm working on") : "", h ? h + " can wait" : ""].filter(Boolean).join(", ");
  main.append(n ? el("h1", {}, plural(n, "thing needs you.", "things need you.") + " ", el("span", { class: "q" }, rest ? rest.charAt(0).toUpperCase() + rest.slice(1) + "." : ""))
                : el("h1", {}, "Nothing needs you. ", el("span", { class: "q" }, rest ? rest.charAt(0).toUpperCase() + rest.slice(1) + "." : "")));
  if (n) { main.append(el("div", { class: "glabel" }, el("span", { class: "mark m-need" }), "Needs you")); d.needs.forEach(it => main.append(taskCard(it))); }
  if (w) { main.append(el("div", { class: "glabel" }, el("span", { class: "mark m-work" }), "Working on it"), el("div", { class: "list" }, d.working.map(it => rowItem(it, "work")))); }
  if (h) { main.append(el("div", { class: "glabel" }, el("span", { class: "mark m-wait" }), "Can wait"), el("div", { class: "list" }, d.wait.map(it => rowItem(it, "wait")))); }
}

function makeCard(m) {
  const p = m.preview || {}; const rich = state.detail.make;
  const pin = el("button", { class: "pin" + (m.pinned ? " on" : ""), "aria-label": m.pinned ? "Unpin" : "Pin", onclick: (e) => { e.stopPropagation(); togglePin(m); } }, svg(m.pinned ? ICON.pinOn : ICON.pin));
  const card = el("div", { class: "mk", onclick: () => openReader(m) },
    el("div", { class: "mk-head" }, el("div", { style: "min-width:0" }, el("div", { class: "mk-title" }, m.title), el("div", { class: "mk-sub" }, "Updated " + when(m.updated_at))), pin));
  if (p.line) card.append(el("div", { class: "first" }, p.line));
  if (rich && Array.isArray(p.numbers) && p.numbers.length) card.append(el("div", { class: "nums" }, p.numbers.slice(0, 6).map(x => el("div", {}, el("span", {}, x.label), el("b", {}, x.value), x.note ? el("small", {}, x.note) : null))));
  return card;
}
function renderMake(main) {
  main.append(header("Finished work", "make"));
  const items = state.make || [];
  main.append(el("h1", {}, "Things I made for you. ", el("span", { class: "q" }, items.some(m => m.pinned) ? "Pinned ones stay on top." : "")));
  if (!items.length) { main.append(el("div", { class: "empty" }, "Nothing yet. Tonight's overview lands here after the 9 PM brief.")); return; }
  const pinned = items.filter(m => m.pinned), rest = items.filter(m => !m.pinned);
  if (pinned.length) { main.append(el("div", { class: "glabel" }, el("span", { class: "mark m-need" }), "Pinned")); pinned.forEach(m => main.append(makeCard(m))); }
  if (rest.length) { main.append(el("div", { class: "glabel" }, el("span", { class: "mark m-wait" }), "Newest first")); rest.forEach(m => main.append(makeCard(m))); }
}

// Small, safe markdown: text is escaped first; only headings, lists, bold, italics, tables and paragraphs.
function md(src) {
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|\W)\*(.+?)\*(?=\W|$)/g, "$1<i>$2</i>");
  const out = []; const lines = (src || "").replace(/\r/g, "").split("\n"); let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*$/.test(l)) { i++; continue; }
    let h = l.match(/^(#{1,4})\s+(.*)/); if (h) { out.push("<h3>" + inline(h[2]) + "</h3>"); i++; continue; }
    if (/^\s*\|/.test(l)) { const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) { if (!/^\s*\|[\s:|-]+\|\s*$/.test(lines[i])) rows.push(lines[i].trim().replace(/^\||\|$/g, "").split("|").map(c => "<td>" + inline(c.trim()) + "</td>").join("")); i++; }
      out.push("<table>" + rows.map(r => "<tr>" + r + "</tr>").join("") + "</table>"); continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) { const ord = /^\s*\d+\./.test(l); const it = []; while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) { it.push("<li>" + inline(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, "")) + "</li>"); i++; }
      out.push((ord ? "<ol>" : "<ul>") + it.join("") + (ord ? "</ol>" : "</ul>")); continue; }
    const para = []; while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,4})\s|^\s*\||^\s*([-*]|\d+\.)\s+/.test(lines[i])) { para.push(inline(lines[i])); i++; }
    out.push("<p>" + para.join("<br>") + "</p>");
  }
  return out.join("");
}
function openReader(m) {
  const r = $("#reader"); r.replaceChildren(
    el("button", { class: "back", onclick: closeReader }, "‹ Back"),
    el("h2", {}, m.title), el("div", { class: "mk-sub" }, "Updated " + when(m.updated_at)));
  const p = m.preview || {};
  if (Array.isArray(p.numbers) && p.numbers.length) r.append(el("div", { class: "nums" }, p.numbers.map(x => el("div", {}, el("span", {}, x.label), el("b", {}, x.value), x.note ? el("small", {}, x.note) : null))));
  const body = el("div", { class: "md" }); body.innerHTML = md(m.body || p.line || ""); r.append(body);
  r.style.display = "block"; r.scrollTop = 0; tg && tg.BackButton && tg.BackButton.show();
}
function closeReader() { $("#reader").style.display = "none"; tg && tg.BackButton && tg.BackButton.hide(); }

function openNote(it) { state.noteFor = it; $("#sheetTitle").textContent = it.title; $("#noteText").value = ""; $("#dimmer").style.display = "block"; $("#sheet").style.display = "block"; setTimeout(() => $("#noteText").focus(), 50); }
function closeNote() { state.noteFor = null; $("#dimmer").style.display = "none"; $("#sheet").style.display = "none"; }
$("#noteCancel").onclick = closeNote; $("#dimmer").onclick = closeNote;
$("#noteSend").onclick = async () => {
  const text = $("#noteText").value.trim(); const it = state.noteFor; if (!text || !it) return;
  try { await rpc("cedric_screen_tap", { p_loop: it.id, p_code: "note", p_label: "Note", p_note: text }); closeNote(); haptic("ok"); toast("Sent to Cedric. He'll answer in the chat."); load(); }
  catch (e) { toast("Didn't send. Check your connection and try again."); }
};
async function tap(it, c) {
  haptic();
  try { await rpc("cedric_screen_tap", { p_loop: it.id, p_code: c.code, p_label: c.label }); it.queued = true; render(); haptic("ok"); toast(c.label + ": sent to Cedric."); }
  catch (e) { toast("Didn't send. Check your connection and try again."); }
}
async function togglePin(m) {
  m.pinned = !m.pinned; render();
  try { await rpc("cedric_screen_pin", { p_id: m.id, p_pinned: m.pinned }); } catch (e) { m.pinned = !m.pinned; render(); toast("Couldn't change the pin."); }
}

function render() {
  const main = $("#main"); main.replaceChildren();
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === state.tab));
  if (state.error) { main.append(el("div", { class: "msg" }, state.error)); return; }
  if (state.tab === "tasks") { if (state.tasks) renderTasks(main); else main.append(el("div", { class: "msg" }, "Loading…")); }
  else { if (state.make) renderMake(main); else main.append(el("div", { class: "msg" }, "Loading…")); }
}
async function load(manual) {
  if (!INIT) { state.error = "Open this from Cedric's chat in Telegram."; render(); return; }
  try {
    const [t, m] = await Promise.all([rpc("cedric_screen_tasks", {}), rpc("cedric_screen_make", {})]);
    state.tasks = t; state.make = m; state.error = null; render(); if (manual) toast("Up to date.");
  } catch (e) {
    state.error = e.message === "not-allowed" ? "This only opens for Cedric's owner, from Cedric's chat. Close it and open it again from the chat." : "Couldn't reach Cedric's database. Pull down or tap refresh to try again.";
    render();
  }
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  const k = t.dataset.tab; haptic();
  if (k === "chat") { tg ? tg.close() : null; return; }
  state.tab = k; localStorage.setItem("cedric.tab", k); closeReader(); render(); window.scrollTo(0, 0);
}));
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
if (tg) {
  tg.ready(); tg.expand();
  const applyTheme = () => document.documentElement.classList.toggle("dark", tg.colorScheme === "dark");
  applyTheme(); tg.onEvent("themeChanged", applyTheme);
  try { tg.setHeaderColor("bg_color"); } catch (e) {}
  tg.BackButton && tg.BackButton.onClick(closeReader);
}
render(); load();
</script>
