<html lang="en">
<head>
<meta charset="utf-8">

<style>
/* Cedric report card, mockup v1 (2026-10-25). Direction carried from the screens Lamont picked 2026-10-24 (sketch B):
   navy actions, a brass mark reserved for Cedric's pick. Three radii only: 14 card, 10 control/photo, 6 small mark. */
:root{
  --page:#0F151C; --card:#18212B; --raise:#1E2833; --line:#26313D; --ink:#E9ECEF; --soft:#9AA6B2; --faint:#6F7B87;
  --navy:#B9CBE0; --navy-tint:#22303F; --on-navy:#0F151C; --pick:#CDAE76; --pick-tint:#2A2418;
  --ok:#74C594; --warn:#C9A86E; --no:#D98C8C;
  --r-card:14px; --r-ctl:10px; --r-mark:6px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:480px;margin:0 auto;padding:0 16px 120px}

.top{position:sticky;top:0;z-index:5;background:var(--page);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.top .back{color:var(--navy);font-weight:600;font-size:15px;min-height:44px;display:flex;align-items:center}
.top .ttl{font-weight:600;font-size:15px;color:var(--soft)}
.top .share{color:var(--navy);font-weight:600;font-size:15px;min-height:44px;display:flex;align-items:center}

.head{padding:22px 0 6px}
.head h1{font:600 29px/1.15 var(--serif);letter-spacing:-.01em}
.head .ask{color:var(--soft);font-size:15px;margin-top:8px}
.head .ask b{color:var(--ink);font-weight:600}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-ctl);padding:4px;margin:18px 0 6px}
.seg button{min-height:48px;border-radius:var(--r-mark);font-weight:600;font-size:15px;color:var(--soft);line-height:1.2}
.seg button small{display:block;font-weight:500;font-size:12.5px;color:var(--faint);margin-top:2px}
.seg button[aria-pressed=true]{background:var(--raise);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.seg button[aria-pressed=true] small{color:var(--soft)}
.basis{font-size:13px;color:var(--faint);margin:2px 2px 16px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;margin-bottom:12px}
.card.pick{border-color:#4A3F2A}
.photos{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:2px;background:#0B1016}
.photos{position:relative}.photos img{flex:0 0 100%;min-width:100%;width:100%;aspect-ratio:16/9;object-fit:cover;scroll-snap-align:start;display:block}
.photos.none{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:13px}
.body{padding:16px}
.mark{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--pick);background:var(--pick-tint);border-radius:var(--r-mark);padding:3px 8px;margin-bottom:10px}
.name{font:600 23px/1.2 var(--serif)}
.sub{color:var(--soft);font-size:14.5px;margin-top:3px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin:14px 0 4px}
.fact .v{font-size:19px;font-weight:650}
.fact .k{font-size:13px;color:var(--soft);margin-top:1px}
.fact .v.small{font-size:16px}
.state{display:flex;align-items:center;gap:8px;font-size:14.5px;margin-top:12px;color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.no{background:var(--no)}
.quote{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin-top:14px;font:italic 16px/1.45 var(--serif);color:var(--ink)}
.quote cite{display:block;font:normal 12.5px/1.4 var(--sans);color:var(--faint);margin-top:4px}
.why{font-size:15px;margin-top:14px;color:var(--ink)}
.why span{color:var(--soft)}
.acts{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:16px}
.primary{min-height:50px;border-radius:var(--r-ctl);background:var(--navy);color:var(--on-navy);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0 14px;text-align:center}
.secondary{min-height:50px;min-width:64px;border-radius:var(--r-ctl);background:var(--navy-tint);color:var(--navy);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;padding:0 14px}
.more{display:block;width:100%;text-align:left;color:var(--navy);font-weight:600;font-size:14.5px;padding:12px 0 0;min-height:44px}
.detail{display:none;border-top:1px solid var(--line);margin-top:12px;padding-top:12px;font-size:14.5px;color:var(--soft)}
.detail.open{display:block}
.detail dl{display:grid;grid-template-columns:96px 1fr;gap:8px 10px}
.detail dt{color:var(--faint)}.detail dd{color:var(--ink)}
.detail .src{font-size:12.5px;color:var(--faint);margin-top:10px}

.section{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 10px}
.section h2{font:600 19px/1.2 var(--serif)}
.section button{color:var(--navy);font-weight:600;font-size:14.5px;min-height:44px}

.row{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);margin-bottom:8px;width:100%;text-align:left}
.row img,.row .ph{width:76px;height:76px;border-radius:var(--r-ctl);object-fit:cover;background:#0B1016}
.row .n{font:600 17px/1.25 var(--serif)}
.row .m{font-size:13.5px;color:var(--soft);margin-top:3px}
.row .s{font-size:13px;margin-top:5px;display:flex;align-items:center;gap:6px}
.row.closed{opacity:.55}
.expanded{margin-bottom:8px}

.foot{margin-top:26px;border-top:1px solid var(--line);padding-top:16px}
.foot .primary{width:100%}
.askbar{display:flex;gap:8px;margin-top:12px}
.askbar input{flex:1;min-height:48px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font:15px var(--sans)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chips button{min-height:40px;border-radius:var(--r-ctl);border:1px solid var(--line);color:var(--soft);font-size:14px;padding:0 12px}
.links{display:flex;justify-content:space-between;margin-top:18px}
.links button{color:var(--navy);font-weight:600;font-size:14.5px;min-height:44px}
.checked{font-size:12.5px;color:var(--faint);margin-top:6px}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20}
.sheet.open{display:block}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;background:var(--card);border-radius:var(--r-card) var(--r-card) 0 0;padding:18px 16px 32px;border-top:1px solid var(--line)}
.panel h3{font:600 20px/1.2 var(--serif);margin-bottom:12px}
.panel .close{float:right;color:var(--navy);font-weight:600;min-height:44px}
table.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
table.cmp th,table.cmp td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.cmp th{color:var(--faint);font-weight:600;font-size:12.5px}
table.cmp td.nm{font-weight:600;color:var(--ink)}
.srcl li{margin:0 0 10px 18px;color:var(--soft);font-size:14px}
.srcl a{color:var(--navy)}
.toast{position:fixed;left:16px;right:16px;bottom:24px;background:var(--raise);border:1px solid var(--line);border-radius:var(--r-ctl);padding:14px;font-size:14.5px;display:none;z-index:30}
.toast.show{display:block}
</style>
</head>

<div class="top"><a class="back" href="#" onclick="toast('This mockup opens on its own. In Cedric, this goes back to Tasks.');return false">‹ Tasks</a><span class="ttl">Dinner for two</span><button class="share" onclick="share()">Share</button></div>
<div class="wrap">
  <div class="head">

    <button class="secondary" style="width:100%" onclick="share()">Send the top 3 to your wife</button>
    <div class="askbar"><input id="q" placeholder="Ask Cedric about these…" onkeydown="if(event.key==='Enter')ask()"><button class="secondary" onclick="ask()">Ask</button></div>

  </div>
</div>

15 x 1.28 = ~$147. Fits under $150 only with mid-priced entrees. A steak or second round of drinks goes over."}, "drive_min": 45, "booking": {"method": "resy", "url": "https://resy.com/cities/madison-ga/venues/town-220"}, "nights": {"mon": {"open": false, "text": "Closed Mondays"}, "tue": {"open": true, "text": "Dinner 5 to 9"}}, "waze_url": "https://waze.com/ul?q=220%20W%20Washington%20St%2C%20Madison%2C%20GA%2030650&navigate=yes", "vibe": ["special occasion", "formal to semi-formal", "former cotton factory", "romantic patio"], "parking": "Parking on site", "why_it_fits": "The special-occasion option: #1 of 52 restaurants in Madison on Tripadvisor, in a historic small-town square.", "main_drawback": "45 minutes away and right at your $150 limit; Tuesday only.", "sources": ["https://town220.com/", "https://town220.com/madison-downtown-madison-town-220-food-menu", "https://town220.com/madison-downtown-madison-town-220-about", "https://town220.com/madison-downtown-madison-town-220-happy-hours-specials", "https://resy.com/cities/madison-ga/venues/town-220", "https://www.exploregeorgia.org/madison/food-drink/casual-full-service/town-220-restaurant"]}], "pick": {"mon": "mystic", "tue": "town220"}, "checked_line": "Hours checked on each restaurant's own site Sat Oct 24 and again Sun Oct 25 3:45 AM. Ratings and review lines from Google (via aggregators). Tables not checked yet.", "method": "Hours, menus and photos come from each restaurant's own site. Google ratings and review lines were read through aggregator pages (Restaurant Guru, Wanderlog) because Google, Yelp and TripAdvisor block automated reads. Totals for two are estimates: two mid-priced entrees, one shared starter, two drinks, 8% tax and 20% tip. Drive times are approximate, from Olde Town Conyers, with weeknight traffic added.", "not_checked": "Not checked: live table availability on OpenTable and Resy, weeknight walk-in waits, holiday or private-event closures, and whether your wife is free."}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const R = D.restaurants; let night = 'mon'; let open = {};
const tg = window.Telegram && Telegram.WebApp; if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = t => t ? `$${t.low}–${t.high}` : '—';
function hours(r){ return r.nights[night]; }
function entreeRange(r){ const ps=(r.dishes||[]).map(d=>parseFloat(String(d.price).replace(/[^0-9.]/g,''))).filter(n=>n>0); if(!ps.length) return '—'; const lo=Math.round(Math.min(...ps)), hi=Math.round(Math.max(...ps)); return lo===hi?`$${lo}`:`$${lo}–${hi}`; }
function shortHood(h){ return String(h||'').replace(/\s*\([^)]*\)/g,'').split(/[,;]/)[0]; }
function srcLabel(u){ const h=u.replace(/^https?:\/\/(www\.)?/,''); if(/restaurantguru/.test(h)) return 'Google rating (Restaurant Guru)'; if(/wanderlog/.test(h)) return 'Google rating (Wanderlog)'; if(/restaurantji/.test(h)) return 'Reviews (Restaurantji)'; if(/infatuation/.test(h)) return 'The Infatuation'; if(/exploregeorgia/.test(h)) return 'Explore Georgia'; if(/web\.archive/.test(h)) return 'Own site (archived copy)'; if(/opentable/.test(h)) return 'OpenTable'; if(/resy/.test(h)) return 'Resy'; if(/menu|\.pdf|imenupro/.test(h)) return 'Menu'; return 'Own site'; }
function isOpen(r){ return hours(r).open; }
function stateLine(r){
  const h = hours(r);
  if (!h.open) return `<div class="state"><span class="dot no"></span>Closed ${night==='mon'?'Mondays':'Tuesdays'}</div>`;
  const b = r.booking;
  const how = b.method==='walk-in' ? 'No reservations' :
              b.method==='opentable' ? 'OpenTable · tables not checked' :
              b.method==='resy' ? 'Resy · tables not checked' : 'Call ahead to book';
  return `<div class="state"><span class="dot ${b.method==='walk-in'?'warn':'ok'}"></span>${esc(h.text)} · ${how}</div>`;
}
function primaryAct(r){
  const b = r.booking;
  if (!isOpen(r)) return `<button class="primary" onclick="setNight('${night==='mon'?'tue':'mon'}')">See ${night==='mon'?'Tuesday':'Monday'}</button>`;
  if (b.method==='walk-in') return `<a class="primary" href="${esc(r.waze_url)}" target="_blank">Go · Waze</a>`;
  return `<a class="primary" href="${esc(b.url || r.website)}" target="_blank" onclick="booked('${esc(r.name)}')">Book 6:30</a>`;
}
function photos(r){
  return r.photo_urls && r.photo_urls.length ? `<div class="photos">${r.photo_urls.map(u=>`<img src="${esc(u)}" alt="" loading="lazy" onerror="this.remove()">`).join('')}</div>` : `<div class="photos none">No photo yet</div>`;
}
function full(r, isPick){
  const rt = r.rating ? `${r.rating.value}★ <span style="color:var(--soft);font-weight:500;font-size:14px">(${Number(r.rating.count).toLocaleString()} ${esc(r.rating.source)})</span>` : 'Not rated yet';
  const q = (r.review_lines||[])[0];
  return `<div class="card ${isPick?'pick':''}">${photos(r)}<div class="body">
    ${isPick?`<div class="mark">Cedric's pick for ${night==='mon'?'Monday':'Tuesday'}</div>`:''}
    <div class="name">${esc(r.name)}</div>
    <div class="sub">${esc(r.cuisine)} · ${esc(shortHood(r.neighborhood))}</div>
    <div class="facts">
      <div class="fact"><div class="v num">${money(r.total_for_two)}</div><div class="k">for two, all in</div></div>
      <div class="fact"><div class="v num">${r.drive_min} min</div><div class="k">drive, about</div></div>
      <div class="fact"><div class="v small">${rt}</div><div class="k">rating</div></div>
      <div class="fact"><div class="v small num">${entreeRange(r)}</div><div class="k">entrées</div></div>
    </div>
    ${stateLine(r)}
    ${q?`<blockquote class="quote">“${esc(q.text)}”<cite>${esc(q.source)}, ${esc(q.date_or_age)}</cite></blockquote>`:''}
    <p class="why">${esc(r.why_it_fits)} <span>${esc(r.main_drawback)}</span></p>
    <div class="acts">${primaryAct(r)}<a class="secondary" href="tel:${esc(r.phone)}">Call</a>${r.booking.method==='walk-in' || !isOpen(r) ? `<a class="secondary" href="${esc(r.menu_url||r.website)}" target="_blank">Menu</a>` : `<a class="secondary" href="${esc(r.waze_url)}" target="_blank">Waze</a>`}</div>
    <button class="more" onclick="toggleDetail(this)">Menu, parking, details</button>
    <div class="detail"><dl>
      <dt>Menu</dt><dd>${(r.dishes||[]).map(d=>esc(d.name)+' '+esc(d.price)).join('<br>') || '—'}${r.menu_url?`<br><a style="color:var(--navy)" href="${esc(r.menu_url)}" target="_blank">Full menu</a>`:''}</dd>
      <dt>Feel</dt><dd>${(r.vibe||[]).map(esc).join(', ') || '—'}</dd>
      <dt>Parking</dt><dd>${esc(r.parking || '—')}</dd>
      <dt>Address</dt><dd>${esc(r.address)}</dd>
      <dt>Hours</dt><dd>Mon: ${esc(r.nights.mon.text)}<br>Tue: ${esc(r.nights.tue.text)}</dd>
      <dt>Estimate</dt><dd>Two entrées, a shared starter, two drinks, tax and 20% tip.</dd>
    </dl>${(r.review_lines||[])[1]?`<blockquote class="quote">“${esc(r.review_lines[1].text)}”<cite>${esc(r.review_lines[1].source)}, ${esc(r.review_lines[1].date_or_age)}</cite></blockquote>`:''}</div>
  </div></div>`;
}
function row(r, i){
  const img = r.photo_urls && r.photo_urls[0] ? `<img src="${esc(r.photo_urls[0])}" alt="" loading="lazy" onerror="this.outerHTML='<div class=ph></div>'">` : `<div class="ph"></div>`;
  const h = hours(r);
  const s = !h.open ? `<span class="dot no"></span>Closed ${night==='mon'?'Mondays':'Tuesdays'}` :
            r.booking.method==='walk-in' ? `<span class="dot warn"></span>Walk-in · ${esc(h.text)}` : `<span class="dot ok"></span>${esc(r.booking.method==='opentable'?'OpenTable':r.booking.method==='resy'?'Resy':'Call ahead')} · ${esc(h.text)}`;
  return `<button class="row ${h.open?'':'closed'}" onclick="expand(${i})">${img}<div><div class="n">${esc(r.name)}</div>
    <div class="m num">${r.drive_min} min · ${money(r.total_for_two)} for two${r.rating?` · ${r.rating.value}★`:''}</div><div class="s">${s}</div></div></button>`;
}
function render(){
  const pick = R.find(r => r.id === D.pick[night]);
  document.getElementById('h1').textContent = `Dinner, ${night==='mon'?'Monday':'Tuesday'} night`;
  document.getElementById('pick').innerHTML = full(pick, true);
  const others = R.filter(r => r !== pick).sort((a,b) => (isOpen(b)-isOpen(a)) || a.drive_min - b.drive_min);
  document.getElementById('rows').innerHTML = others.map(r => open[r.id] ? `<div class="expanded">${full(r,false)}<button class="more" onclick="collapse('${r.id}')">Show less</button></div>` : row(r, R.indexOf(r))).join('');
  for (const n of ['mon','tue']) { const c = R.filter(r=>r.nights[n].open).length; document.getElementById('cnt-'+n).textContent = `${c} of ${R.length} open`; }
  document.getElementById('seg-mon').setAttribute('aria-pressed', night==='mon'); document.getElementById('seg-tue').setAttribute('aria-pressed', night==='tue');
  document.getElementById('checked').textContent = D.checked_line;
  document.getElementById('cmp').innerHTML = `<table class="cmp"><tr><th></th><th>Drive</th><th>For two</th><th>Rating</th><th>${night==='mon'?'Mon':'Tue'}</th></tr>` +
    [...R].sort((a,b)=>a.drive_min-b.drive_min).map(r=>`<tr><td class="nm">${esc(r.name)}</td><td class="num">${r.drive_min}m</td><td class="num">${money(r.total_for_two)}</td><td class="num">${r.rating?r.rating.value+'★':'—'}</td><td>${hours(r).open?(r.booking.method==='walk-in'?'Walk-in':'Book'):'Closed'}</td></tr>`).join('') + `</table>`;
  document.getElementById('src').innerHTML = `<p style="color:var(--soft);font-size:14px;margin-bottom:12px">${esc(D.method)}</p><ul class="srcl">` +
    R.map(r=>{ const seen={}; const ls=[...(r.rating&&r.rating.url?[r.rating.url]:[]),...(r.sources||[])].filter(u=>{const l=srcLabel(u); if(seen[l]) return false; seen[l]=1; return true;}).slice(0,5).map(u=>`<a href="${esc(u)}" target="_blank">${esc(srcLabel(u))}</a>`).join(' · '); return `<li><b style="color:var(--ink)">${esc(r.name)}</b><br>${ls}</li>`; }).join('') +
    `</ul><p style="color:var(--faint);font-size:13px">${esc(D.not_checked)}</p>`;
}
function setNight(n){ night = n; open = {}; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function expand(i){ open[R[i].id] = true; render(); }
function collapse(id){ delete open[id]; render(); }
function toggleDetail(b){ const d = b.nextElementSibling; d.classList.toggle('open'); b.textContent = d.classList.contains('open') ? 'Hide details' : 'Menu, parking, details'; }
function openSheet(k){ document.getElementById('sh-'+k).classList.add('open'); }
function closeSheet(){ document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open')); }
let tt; function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(()=>t.classList.remove('show'), 3200); }
function booked(n){ setTimeout(()=>toast(`When you come back, Cedric asks: did you get the table at ${n}? Then it goes on your calendar.`), 400); }
function ask(q){ q = q || document.getElementById('q').value; if(!q) return; toast(`In Cedric, "${q}" goes to him and this report updates in place.`); document.getElementById('q').value=''; }
function share(){
  const top = R.filter(r=>r.nights[night].open).sort((a,b)=>a.drive_min-b.drive_min).slice(0,3);
  const txt = `Dinner ${night==='mon'?'Monday':'Tuesday'} night? A few options:\n` + top.map((r,i)=>`${i+1}. ${r.name} (${r.cuisine}, ${r.drive_min} min)`).join('\n') + `\nWhich sounds good?`;
  const url = 'https://t.me/share/url?url=' + encodeURIComponent(top[0].website) + '&text=' + encodeURIComponent(txt);
  if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank');
}
const P = new URLSearchParams(location.search);
if (P.get('w')) { const w = P.get('w') + 'px'; document.documentElement.style.cssText = `width:${w};overflow-x:hidden`; document.body.style.width = w; const st = document.createElement('style'); st.textContent = `.sheet,.top{right:auto;width:${w}} .toast{right:auto;width:calc(${w} - 32px)}`; document.head.appendChild(st); }
if (P.get('night') === 'tue') night = 'tue';
if (P.get('expand')) open[P.get('expand')] = true;
render();
if (P.get('detail')) { const b = document.querySelector('#pick .more'); if (b) toggleDetail(b); }
if (P.get('sheet')) openSheet(P.get('sheet'));
</script>
</body>
